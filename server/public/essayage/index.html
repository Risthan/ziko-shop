<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090D10" />
    <title>Essayage en direct — Ziko Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main class="page">
      <header class="brand">
        <img src="logo.png" alt="Ziko Shop" class="logo" />
      </header>

      <h1>Essayage en direct</h1>
      <p class="lead" id="product-line">Chargement du produit…</p>

      <section class="stage" aria-live="polite">
        <video id="output" class="video" autoplay playsinline muted></video>
        <img id="garment" class="garment" alt="" hidden />
        <div class="overlay" id="overlay">
          <p id="overlay-text">Placez-vous face à la caméra, le haut du corps bien visible.</p>
        </div>
        <span class="live" id="live" hidden><span class="dot"></span>EN DIRECT</span>
        <span class="timer" id="timer" hidden>1:00</span>
      </section>

      <div class="swatches" id="swatches" aria-label="Couleurs"></div>

      <p class="message" id="message" role="status"></p>

      <div class="actions">
        <button id="start" class="button primary" disabled>Allumer la caméra et essayer</button>
        <button id="stop" class="button secondary" hidden>Terminer l'essayage</button>
      </div>

      <p class="fineprint">
        Votre image est envoyée en direct au service d'essayage (Fal.ai) uniquement pendant la séance, limitée à
        une minute. Rien n'est enregistré par Ziko Shop.
      </p>
    </main>
  </body>
</html>
